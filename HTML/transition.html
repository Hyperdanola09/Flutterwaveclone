<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .card {
            width: 200px;
            height: 300px;
            background-color: purple;
            transition-property: width;
            transition-duration: 2s;
            transition-delay: 1s;
            transition-timing-function: linear;
            /* ease
            ease-in
            ease-out
            ease-in-out
            linear */
        }

        .card1 {
            width: 200px;
            height: 300px;
            margin-top: 10px;
            background-color: purple;
            transition-property: width;
            transition-duration: 2s;
            transition-delay: 1s;
            transition-timing-function: ease-in;
        }

        .card2 {
            width: 200px;
            height: 300px;
            margin-top: 10px;
            background-color: purple;
            transition-property: width;
            transition-duration: 2s;
            transition-delay: 1s;
            transition-timing-function: ease-in-out;
            /* property duration timingfunction delay */
            transition: width 2s ease-in-out 1s ;
        }

        .card:hover,
        .card1:hover,
        .card2:hover {
            background-color: red;
            width: 500px;
        }
        .box{
            width: 150px;
            height: 200px;
            background-color: paleturquoise;
            transition: all 2s ease-in 1s;
            margin-top: 20px;

        }
        .box:hover{
            background-color: rosybrown;
            width: 300px;
            height: 250px;
            transform: rotate(20deg);
        }
        .path{
            width: 200px;
            height: 200px;
            clip-path: polygon(0 1%,0% 100%, 61% 100%);
            background-color: red;
        }
        .image img{
            filter: grayscale();
            width: 100%;

        }
    </style>
</head>

<body>
    <div class="card"></div>
    <div class="card1"></div>
    <div class="card2"></div>
    <div class="box"></div>
    <div class="path"></div>
    <div class="image">
        <img src="/image/5f9c9cd8740569d1a4ca347f.jpg" alt="">
    </div>
</body>

</html>
