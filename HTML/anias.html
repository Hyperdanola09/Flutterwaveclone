<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #ffffff;
    }

    /* Simple Fade-In Animation */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      text-align: center;
      animation: slideUp 0.8s ease-out;
      animation-iteration-count: infinite;
      
    }

    /* Google Logo Colors */
    .logo {
      font-size: 72px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .blue { color: #4285F4; }
    .red { color: #EA4335; }
    .yellow { color: #FBBC05; }
    .green { color: #34A853; }

    /* Search Box */
    .search-box {
      width: 90%;
      max-width: 500px;
      padding: 12px 20px;
      font-size: 16px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      outline: none;
      transition: box-shadow 0.2s ease;
    }

    .search-box:focus {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }

    /* Buttons */
    .buttons {
      margin-top: 25px;
    }

    .btn {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      color: #3c4043;
      padding: 10px 18px;
      font-size: 14px;
      margin: 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
    </div>
    
    <input type="text" class="search-box" placeholder="Search Google or type a URL">

    <div class="buttons">
      <button class="btn">Google Search</button>
      <button class="btn">I'm Feeling Lucky</button>
    </div>
  </div>

</body>
</html>
