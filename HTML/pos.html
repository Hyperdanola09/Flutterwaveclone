<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css positioning</title>
    <style>
       *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
       } 
       body{
        height: 1000px;
       }
       .box{
        width: 300px;
        height: 300px;
        position: relative;
        top: 20px;
        left: 20px;
        background-color: red;
       }
       .circle{
        width: 70px;
        height: 70px;
        border-radius: 50px;
        background-color: pink;
        position: fixed;
        right: 10px;
        bottom: 15px;
        
       }
       .absolute{
        width: 300px;
        height: 200px;
        background-color: rebeccapurple;
        /* position:absolute; */
        top: 0;
       }
       section{
        width: 100%;
        height: 100vh;
        background-color: cornflowerblue;
       }
       .container{
        width: 400px;
        height: 300px;
        border: 2px solid red;
        position: relative;
       }
       .inner{
        width: 50px;
        height: 50px;
        background-color: teal;
        position: absolute;
        bottom: 0;
        right: 10px;
       }
       header{
        width: 100%;
        height: 10vh;
        background-color: dodgerblue;
        position: sticky;
        top: 0;
       }
       .index{
        width: 400px;
        height: 300px;
        border: 2px solid black;
        margin: 50px auto;
        position: relative;
       }
       .card{
        width: 120px;
        height: 120px;
        position: absolute;
       }
       .red{
        background-color: red;
        z-index: 1;
        left: 20px;
        top: 20px;

       }
       .green{
        background-color: green;
        z-index: 2;
        left: 60px;
        top: 60px;

       }
       .blue{
        background-color: blue;
        z-index: 3;
        left: 100px;
        top: 100px;

       }
    </style>
</head>
<body>
    <header></header>
    <h1>Hello</h1>
    <p>paragragh tag</p>
    <h2>Hello world</h2>
    <div class="box">

    </div>
    <div class="circle"></div>
    <div class="absolute"></div>
    <section></section>
    <div class="container">
        <div class="inner"></div>
    </div>
    <div class="index">
        <div class="card red"></div>
        <div class="card green"></div>
        <div class="card blue"></div>
        <div></div>
        <div></div>
    </div>
</body>
</html>
