<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Flutterwave for business</title>
    <link rel="shortcut icon" href="/image/Annotation 2026-08-31 195523.jpg">
    <style>
        body{
            position: relative;
        }
        header{
            width: 100%;
        }
        .accounthead{
            width: 90%;
            margin: auto;
            color: #333;
            display: flex;
            font-size: 14px;
            justify-content: space-between;
            line-height: 16.1px;
            padding: 32px 30px;
            text-shadow: #00000001 1px 1px 1px;

        }
        .accounthead img{
            width: 185px;
            height: 7vh;
        }
        .accounthead a{
            width: 132px;
            height: 3vh;
            background-color: #ff9b00;
            border-color: #0000;
            border-radius: 4px;
            border-style: solid;
            border-width: 0.6666667px;
            color: #12122c;
            display: inline-block;
            font-family: Moderat;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.0024px;
            line-height: 16.1px;
            padding: 7.5px 16px;
            text-align: center;
            text-shadow: #00000001 1px 1px 1px;
            text-decoration: none;
        }
        .form{
            margin-top: 18vh;
            height: 323px;
            width: 343px;
            margin-left: 5%;
            padding: 2%;
            background-color: antiquewhite;
            border-radius: 10px;
            
        }
        .formtitle{
            width: 85%;
            color: #333;
            font-family: Moderat;
            font-size: 18px;
            font-weight: 500;
            line-height: 22px;
            margin: 0px 0px 20px;
            margin-left: auto;
            margin-right: auto;
            text-shadow: #00000001 1px 1px 1px;
        }
        .form .divalt{
            width: 85%;
            margin: auto;
            align-items: center;
            background-color: #fff;
            border-color: #e0e0e0;
            border-radius: 4px;
            border-style: solid;
            border-width: 0.666667px;
            color: #333;
            display: flex;
            font-size: 14px;
            line-height: 19px;
            padding: 12px 16px 11px;
            text-shadow: #00000001 1px 1px 1px;
            height: 6vh;
            margin-bottom: 3vh;

        }
        .baseinp{
            width: 100%;
            border: none;
            border-style: none;
            font-family: Moderat;
            font-size: 14px;
            line-height: 19px;
        }
        .form button{
            width: 100%;
            margin: 2vh auto;
            /* display: block; */
            background-color: #ff9b00;
            border-color: #0000;
            border-radius: 4px;
            border-style: solid;
            border-width: 0.666667px;
            color: #12122c;
            display: inline-block;
            font-family: Moderat;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.0024px;
            line-height: 22px;
            padding: 14px;
            text-align: center;
        }
        .formitem{
            width: 85%;
            margin: auto;
            color: #333;
            margin-top: 3vh;
            line-height: 18.4px;
            text-shadow: #00000001 1px 1px 1px;

        }
        .formitem a{
            color: #576ae6;
            display: inline;
            font-family: Moderat;
            font-size: 14px;
            line-height: 20px;
            text-shadow: #00000001 1px 1px 1px;
            text-decoration: none;
        }
        footer{
            width: 95%;
            margin: auto;
            align-items: center;
            color: #333;
            display: flex;
            font-size: 14px;
            justify-content: space-between;
            line-height: 16.1px;
            padding: 0px 5px;
            text-shadow: #00000001 1px 1px 1px;
        }
        footer .fo2{
            width: 25%;
            color: #333;
            font-size: 14px;
            line-height: 16.1px;
            padding: 32px 25px;
            text-shadow: #00000001 1px 1px 1px;
            display: flex;
            justify-content: space-around;
            gap: 4%;
        }
        .footersp{
            text-decoration: none;
            color: #333;
            display: inline;
            font-family: Moderat;
            font-size: 14px;
            line-height: 16.1px;
            text-shadow: #00000001 1px 1px 1px;
        }
        .fo1{
            width: 55%;
            color: #333;
            font-size: 14px;
            line-height: 16.1px;
            padding: 32px 25px;
            text-shadow: #00000001 1px 1px 1px;
        }
        .relimg{
            text-align: center;
            justify-content: center;
            align-items: center;
            /* position: absolute; */
            position: sticky;
            bottom: 10vh;
            left: 90%;
            width: 35px;
            align-items: center;
            padding: 1%;
            /* height: 5vh; */
            border-radius: 50px;
            background-color: #ff9b00;
        }
        .relimg img{
            text-align: center;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            
        }
    </style>
</head>
<body>
    <header>
    <div class="accounthead">
        <img src="/image/FLUT.svg" alt="">
        <a href="/HTML/flutonboard.html">Create Account</a>
    </div>
    </header>
    <div class="form">
        <h1 class="formtitle">Login to your account</h1>
        <div class="divalt"><input type="email" placeholder="Email address" class="baseinp"></div>
        <div class="divalt"><input type="password" placeholder="Password" class="baseinp"></div>
        <button>Login</button>
        <div class="formitem"><a href="">Forgot Password?</a></div>
        
    </div>
    <footer>
        <div class="fo1"><span class="footersp"> Flutterwave Technology Solutions Limited.Licensed by the Central Bank of Nigeria.</span></div>
        <div class="fo2">
            <a href="" class="footersp">Privacy Policy</a>
            <a href="" class="footersp">Terms and conditions</a>
        </div>
    </footer>
    <div class="relimg"><img src="/image/chat-left-text (1).svg" alt=""></div>
</body>
</html>
