<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS transform</title>
    <link rel="stylesheet" href="httpscdn.js">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .transform,
        .transformX,
        .transformY {
            width: 300px;
            height: 300px;
            background-color: red;
            margin-top: 10px;
        }

        .transform:hover {
            /* x,y */
            transform: translate(50px, 100px);
        }

        .transformX:hover {
            transform: translateX(50px);
        }

        .transformY:hover {
            transform: translateY(50px);
        }

        .rotate {
            width: 200px;
            height: 200px;
            background-color: purple;
            margin-top: 10px;
        }

        .rotate:hover {
            transform: rotate(20deg);
        }

        .icon {
            font-size: 35px;
            color: peru;
        }

        .icon:hover {
            transform: rotate(40deg);
        }

        .card,
        .cardX,
        .cardY {
            width: 300px;
            height: 200px;
            background-color: rebeccapurple;
            margin-top: 10px;
        }

        .card:hover {
            /* width,height */
            transform: scale(2, 3);
        }

        .cardX:hover {
            transform: scaleX(1.3);


        }

        .cardY {
            width: 300px;
            height: 200px;
            background-color: peachpuff;
            margin-top: 50px;
            margin-bottom: 20px;
        }

        .cardY:hover {
            transform: scaleY(1.1);

        }

        .skew,
        .skewX,
        .skewY {
            width: 300px;
            height: 200px;
            background-color: teal;
            margin-top: 10px;

        }

        .skew:hover {
            transform: skew(20deg, 30deg);
        }

        .skewX:hover {
            transform: skewX(20deg);
        }

        .skewY:hover {
            transform: skewY(20deg);
        }
        .box{
            width: 300px;
            height: 400px;
            background-color: red;


        }
        .box:hover{
            background-color: rebeccapurple;
        }
    </style>
</head>

<body>
    <!-- tranlate
    rotate
    scale
    skew
    cdnjs -->

    <div class="transform"></div>
    <div class="transformX"></div>
    <div class="transformY"></div>

    <div class="rotate"></div>
    <i class="fa-solid fa-plus icon"></i>

    <div class="card"></div>
    <div class="cardX"></div>
    <div class="cardY"></div>
    <div class="skew"></div>
    <div class="skewX"></div>
    <div class="skewY"></div>

    <div class="box"></div>

</body>

</html>
